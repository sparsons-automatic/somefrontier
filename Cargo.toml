[package]
name = "some-frontier"
version = "0.1.0"
edition = "2021"
default-run = "some-frontier"

[dependencies]
macroquad = { version = "0.4", features = ["audio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1.1"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
