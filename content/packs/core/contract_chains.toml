[[contract_chains]]
id = "derelict_recovery"
name = "The Silent Relay"
summary = "Follow an Exchange rumor to a lost archive courier and recover its survey record."
origin_station = "frontier_exchange"
origin_service = "saloon"

[[contract_chains.stages]]
id = "locate"
name = "Follow the rumor"
description = "Travel beyond the northwest traffic lanes and approach the Pale Relay Derelict."
next_stage = "identify"

[[contract_chains.stages.objectives]]
id = "reach_derelict"
kind = "reach_location"
target = "pale_relay_derelict"

[[contract_chains.stages]]
id = "identify"
name = "Read the relay signature"
description = "Select the wreck at scanner range and complete its identity scan."
next_stage = "recover"

[[contract_chains.stages.objectives]]
id = "scan_derelict"
kind = "scan_identify"
target = "pale_relay_derelict"

[[contract_chains.stages]]
id = "recover"
name = "Recover the archive"
description = "Approach cargo range and loot the Pale Relay Archive from the physical wreck hold."
next_stage = "return"

[[contract_chains.stages.objectives]]
id = "loot_archive"
kind = "loot_item"
target = "pale_relay_derelict"
item = "pale_relay_archive"

[[contract_chains.stages]]
id = "return"
name = "Return the archive"
description = "Carry the archive back to Exchange Rumors at Frontier Exchange."

[[contract_chains.stages.objectives]]
id = "deliver_archive"
kind = "deliver_item"
target = "frontier_exchange"
item = "pale_relay_archive"

[[contract_chains.rewards]]
kind = "credits"
amount = 650

[[contract_chains.rewards]]
kind = "reputation"
target = "cinder_cooperative"
amount = 8

